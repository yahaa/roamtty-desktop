[workspace]
resolver = "2"
members = ["crates/proto", "bin/roamtty-desktop"]

[workspace.package]
version = "0.5.8"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/yahaa/roamtty-desktop"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
