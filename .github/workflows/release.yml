name: release
on:
  push:
    tags: ["v*"]
  pull_request:
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - target: aarch64-unknown-linux-gnu
            name: linux-aarch64
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc >> $GITHUB_ENV
      - run: cargo test --workspace
        if: matrix.target == 'x86_64-unknown-linux-gnu'
      - run: cargo build --release --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/roamtty-desktop ${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}
  deny:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, deny]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: bins
      - run: scripts/package.sh "${GITHUB_REF_NAME#v}" linux-x86_64=bins/linux-x86_64/linux-x86_64 linux-aarch64=bins/linux-aarch64/linux-aarch64
      # A release is immutable once published: the app pins its SHA-256, so never replace its files.
      - run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes "roamtty-desktop $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
