[package]
name = "roamtty-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
proto = { package = "roamtty-desktop-proto", path = "../../crates/proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols = { version = "0.32", features = ["client"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", features = ["shm", "xtest", "xfixes", "randr"] }
openh264 = { version = "0.9.9", default-features = false, features = ["libloading"] }
openh264-sys2 = { version = "0.9.9", default-features = false, features = ["libloading"] }
bzip2-rs = "0.1"
sha2 = "0.10"
