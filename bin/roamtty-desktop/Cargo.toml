[package]
name = "roamtty-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
proto = { package = "roamtty-desktop-proto", path = "../../crates/proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", features = ["shm", "xtest", "xfixes", "randr"] }
openh264 = { version = "0.9.9", default-features = false, features = ["libloading"] }
openh264-sys2 = { version = "0.9.9", default-features = false, features = ["libloading"] }
bzip2-rs = "0.1"
sha2 = "0.10"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSError", "NSObject", "NSDictionary", "NSValue"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSRunningApplication", "NSWorkspace"] }
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-video-toolbox = "0.3"
objc2-screen-capture-kit = "0.3"
